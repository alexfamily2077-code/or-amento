<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçamento de Produtos e Serviços</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Gerador de Orçamento</h1>
            <p>Cadastre produtos ou serviços e calcule seu orçamento.</p>
        </header>

        <section class="formulario">

            <div class="campo">
                <label for="descricao">Produto ou Serviço</label>
                <input 
                    type="text" 
                    id="descricao" 
                    placeholder="Ex: Desenvolvimento de site"
                >
            </div>

            <div class="campo">
                <label for="quantidade">Quantidade</label>
                <input 
                    type="number" 
                    id="quantidade" 
                    min="1" 
                    value="1"
                >
            </div>

            <div class="campo">
                <label for="valor">Valor unitário (R$)</label>
                <input 
                    type="number" 
                    id="valor" 
                    min="0" 
                    step="0.01"
                    placeholder="0,00"
                >
            </div>

            <button onclick="adicionarItem()">
                Adicionar item
            </button>

        </section>

        <section class="lista">

            <h2>Itens do orçamento</h2>

            <table>
                <thead>
                    <tr>
                        <th>Produto/Serviço</th>
                        <th>Qtd.</th>
                        <th>Valor Unit.</th>
                        <th>Total</th>
                        <th>Ação</th>
                    </tr>
                </thead>

                <tbody id="listaItens">
                    <!-- Os itens serão adicionados pelo JavaScript -->
                </tbody>
            </table>

            <p id="mensagemVazia">
                Nenhum item adicionado.
            </p>

        </section>

        <section class="resumo">

            <div class="desconto">
                <label for="desconto">Desconto (%)</label>

                <input 
                    type="number" 
                    id="desconto"
                    min="0"
                    max="100"
                    value="0"
                    oninput="calcularOrcamento()"
                >
            </div>

            <div class="valores">

                <p>
                    Subtotal:
                    <strong id="subtotal">R$ 0,00</strong>
                </p>

                <p>
                    Desconto:
                    <strong id="valorDesconto">R$ 0,00</strong>
                </p>

                <p class="totalFinal">
                    Total:
                    <strong id="totalFinal">R$ 0,00</strong>
                </p>

            </div>

        </section>

        <button class="limpar" onclick="limparOrcamento()">
            Limpar orçamento
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
